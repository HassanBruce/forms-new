# Use this instead of Caddy if nginx already runs on the VPS (other sites on 80/443).
# 1) Save as /etc/nginx/sites-available/tripdesk, replace app.example.com
# 2) ln -s /etc/nginx/sites-available/tripdesk /etc/nginx/sites-enabled/ && nginx -t && systemctl reload nginx
# 3) certbot --nginx -d app.example.com
server {
    listen 80;
    server_name app.example.com;
    client_max_body_size 10M;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
